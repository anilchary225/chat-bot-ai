# Zenoxi API behind nginx: load balancing across several backend copies.
# Used by deploy/nginx/docker-compose.yml. See deploy/nginx/README.md.

worker_processes auto;
events { worker_connections 2048; }

http {
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # Real client IP for the backend's rate limits (the app reads X-Real-IP).
    map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

    # Per-visitor request limits (on top of the app's own limits).
    limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=widget:10m rate=5r/s;
    limit_req_status 429;

    # least_conn sends each request to the copy with the fewest active requests, which suits
    # long-lived streaming answers better than plain round-robin.
    upstream zenoxi_api {
        least_conn;
        server api1:8000 max_fails=3 fail_timeout=15s;
        server api2:8000 max_fails=3 fail_timeout=15s;
        server api3:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # Compress normal JSON, but never the streaming chat responses (application/x-ndjson),
    # because compression buffers them and the answer would stop streaming.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        client_max_body_size 12m;   # 10 MB uploads + form overhead

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        # Shared proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;        # AI answers and resume tailoring can be slow
        proxy_send_timeout 120s;
        proxy_buffering off;            # stream tokens to the browser as they arrive
        proxy_request_buffering on;     # but receive uploads fully before passing them on
        proxy_next_upstream error timeout http_502 http_503;  # only retried for safe (GET) requests
        proxy_next_upstream_tries 2;

        # Public website-widget API: stricter per-IP limit.
        location /api/public/ {
            limit_req zone=widget burst=20 nodelay;
            proxy_pass http://zenoxi_api;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://zenoxi_api;
        }

        # Meta (WhatsApp/Instagram) webhooks: no rate limit, Meta sends bursts.
        location /webhooks/ {
            proxy_pass http://zenoxi_api;
        }

        location /docs { proxy_pass http://zenoxi_api; }
        location /openapi.json { proxy_pass http://zenoxi_api; }

        location / { return 404; }
    }
}
