<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zenoxi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231711"/>
      <stop offset="1" stop-color="#0b0a09"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.36" stop-color="#ff6a2b"/>
      <stop offset="0.72" stop-color="#d9361c"/>
      <stop offset="1" stop-color="#ffb627"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb627" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffb627"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <!-- In the ring's rotated frame: back arc = top half, front arc = bottom half -->
    <clipPath id="front"><rect x="0" y="262" width="512" height="250"/></clipPath>
    <clipPath id="back"><rect x="0" y="0" width="512" height="262"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="262" r="128" fill="#ea580c" opacity="0.55" filter="url(#glow)"/>

  <!-- back half of the orbit (goes behind the globe) -->
  <g transform="rotate(-18 256 262)">
    <ellipse cx="256" cy="262" rx="196" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.55" clip-path="url(#back)"/>
  </g>

  <!-- globe -->
  <circle cx="256" cy="262" r="118" fill="url(#orb)"/>
  <ellipse cx="214" cy="212" rx="46" ry="24" fill="#fff" opacity="0.28" transform="rotate(-28 214 212)"/>
  <rect x="200" y="236" width="30" height="56" rx="15" fill="#1a0f08"/>
  <rect x="282" y="236" width="30" height="56" rx="15" fill="#1a0f08"/>

  <!-- front half of the orbit (passes in front of the globe) with a moon -->
  <g transform="rotate(-18 256 262)">
    <ellipse cx="256" cy="262" rx="196" ry="58" fill="none" stroke="#0b0a09" stroke-opacity="0.35" stroke-width="20" clip-path="url(#front)"/>
    <ellipse cx="256" cy="262" rx="196" ry="58" fill="none" stroke="url(#ring)" stroke-width="12" clip-path="url(#front)"/>
    <circle cx="395" cy="303" r="17" fill="#2dd4bf"/>
  </g>
</svg>
