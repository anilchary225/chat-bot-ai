services:
  - type: web
    name: vac-ai-chat-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: vac_ai_chat
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AGENT_DAILY_MESSAGES
        value: "100"
      - key: AGENT_DAILY_MESSAGES_OWN_KEY
        value: "2000"
      - key: AGENT_DAILY_EMAILS
        value: "50"
      - key: PUBLIC_API_URL
        value: https://chat-bot-ai-ouc2.onrender.com
      - key: CRON_SECRET
        sync: false
      - key: BACKGROUND_JOBS
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_DISPLAY_NUMBER
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: PUBLIC_FRONTEND_URL
        value: https://zenoxi.vercel.app
      - key: FRONTEND_ORIGIN
        value: https://zenoxi.vercel.app
